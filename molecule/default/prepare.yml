---
# A web server on each web host that answers with the host's name, so the
# client can tell which host holds an address. side_effect.yml stops it to
# make a host fail its check.
- name: Start a web server on the web hosts
  hosts: web
  gather_facts: false
  tasks:
    - name: Create the web root
      ansible.builtin.file:
        path: /srv/www
        state: directory
        mode: "0755"

    - name: Write the page
      ansible.builtin.copy:
        dest: /srv/www/index.html
        content: "{{ inventory_hostname }}\n"
        mode: "0644"

    - name: Install the web server unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/molecule-web.service
        content: |
          [Unit]
          Description=Molecule test web server
          [Service]
          ExecStart=/usr/bin/python3 -m http.server {{ test_web_port }} --directory /srv/www
          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Start the web server
      ansible.builtin.systemd_service:
        name: molecule-web
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for the web server
      ansible.builtin.wait_for:
        port: "{{ test_web_port }}"
        timeout: 30

# On Ubuntu the web hosts run ufw, which denies incoming connections by
# default (SSH stays open for Ansible), so VRRP between them and the web port
# from the client only get through when the role opens them.
- name: Start ufw on the Ubuntu web hosts
  hosts: web
  gather_facts: true
  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Allow SSH through ufw
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      when: ansible_facts['os_family'] == 'Debian'

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      when: ansible_facts['os_family'] == 'Debian'
