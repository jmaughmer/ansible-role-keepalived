---
# Each pair shares one virtual address (group_vars/<group>/main.yml). The
# first host in each group is preferred.
all:
  children:
    kibana:
      hosts:
        kb-1.example.com:
        kb-2.example.com:
    logstash:
      hosts:
        ls-1.example.com:
        ls-2.example.com:
    fleet_server:
      hosts:
        fleet-1.example.com:
        fleet-2.example.com:
