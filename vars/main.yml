---
# Internal variables, evaluated lazily.

_ka_check_types: [tcp, http, https, script, none]
# Check types the helper runs, and that keepalived_wait_for_address can test
_ka_port_check_types: [tcp, http, https]

_ka_check_helper: "{{ keepalived_scripts_dir }}/ansible-keepalived-check"
_ka_conf_file: "{{ keepalived_conf_dir }}/keepalived.conf"
# The packaged unit's environment file, with the daemon options
_ka_sysconfig_file: "{{ '/etc/default/keepalived' if ansible_facts['os_family'] == 'Debian' else '/etc/sysconfig/keepalived' }}"

# Every instance this host carries, with defaults applied (facts.yml)
_ka_instances: "{{ _ka_resolved | default([]) }}"

# The same instances as every host in the play carries them, one per name. The
# first host that lists a name decides, which preflight checks is the same for all.
_ka_play_instances: >-
  {{ ansible_play_hosts
     | map('extract', hostvars, '_ka_resolved')
     | map('default', [])
     | flatten
     | unique(attribute='name') }}

_ka_fapolicyd_manage: >-
  {{ (keepalived_fapolicyd_trust | bool)
     if (keepalived_fapolicyd_trust | string | lower) != 'auto'
     else ((_ka_fapolicyd_state.stdout | default('') | trim) == 'active') }}
_ka_fapolicyd_trust_path: "/etc/fapolicyd/trust.d/{{ keepalived_fapolicyd_trust_file }}"

# Address checks in preflight: an IPv4 or IPv6 address with an optional prefix
# length. The IPv6 pattern only checks the characters; keepalived's own
# configuration test catches the rest.
_ka_ipv4_re: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(/([0-9]|[12][0-9]|3[0-2]))?$'
_ka_ipv6_re: '^[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*(/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))?$'
_ka_name_re: '^[A-Za-z0-9_.-]+$'
_ka_firewall_port_re: '^[0-9]+(-[0-9]+)?/(tcp|udp|sctp|dccp)$'

# ufw (Ubuntu's firewall) is active
_ka_ufw_active: "{{ (_ka_ufw_state.stdout | default('')) is search('^Status: active', multiline=True) }}"
